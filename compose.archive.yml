name: forwardbot-archive

services:
  frontend:
    build:
      context: ./ruoyi-fastapi-frontend
      dockerfile: Dockerfile.archive
    ports:
      - "${ARCHIVE_HTTP_PORT:-12581}:80"
    volumes:
      - ./deploy/archive/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./ruoyi-fastapi-backend
      dockerfile: Dockerfile.archive
    environment:
      TZ: Asia/Shanghai
      APP_ENV: archive
      APP_NAME: 素材采集归档
      APP_ROOT_PATH: /archive-api
      APP_PORT: 9099
      APP_RELOAD: "false"
      APP_WORKERS: "1"
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: archive
      DB_PASSWORD: ${ARCHIVE_DB_PASSWORD:?请设置独立的 ARCHIVE_DB_PASSWORD}
      DB_DATABASE: media_archive
      DB_ECHO: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      REDIS_PASSWORD: ${ARCHIVE_REDIS_PASSWORD:?请设置独立的 ARCHIVE_REDIS_PASSWORD}
      JWT_SECRET_KEY: ${ARCHIVE_JWT_SECRET:?请设置独立的 ARCHIVE_JWT_SECRET}
      ARCHIVE_ENABLED: "true"
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-0}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      ARCHIVE_MEDIA_DIR: /data/media
      ARCHIVE_STORAGES_FILE: /run/archive/storages.json
      ARCHIVE_MIN_FREE_BYTES: ${ARCHIVE_MIN_FREE_BYTES:-268435456}
      ARCHIVE_S3_ACCESS_KEY: ${ARCHIVE_S3_ACCESS_KEY:-}
      ARCHIVE_S3_SECRET_KEY: ${ARCHIVE_S3_SECRET_KEY:-}
      LOG_INSTANCE_ID: archive
      LOG_SERVICE_NAME: media-archive
    volumes:
      - media:/data/media
      - app-state:/app/vf_admin
      - logs:/app/logs
      - quark-cli:/opt/quark
      - ./deploy/archive/storages.json:/run/archive/storages.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: ${ARCHIVE_DB_PASSWORD:?请设置独立的 ARCHIVE_DB_PASSWORD}
      POSTGRES_DB: media_archive
    volumes:
      - database:/var/lib/postgresql/data
      - ./ruoyi-fastapi-backend/sql/ruoyi-fastapi-pg.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
      - ./telegram_menu.sql:/docker-entrypoint-initdb.d/02-telegram-menu.sql:ro
      - ./deploy/archive/menu.sql:/docker-entrypoint-initdb.d/03-archive-menu.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d media_archive"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      ARCHIVE_REDIS_PASSWORD: ${ARCHIVE_REDIS_PASSWORD:?请设置独立的 ARCHIVE_REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$ARCHIVE_REDIS_PASSWORD\""]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$ARCHIVE_REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  database:
  redis:
  media:
  app-state:
  logs:
  quark-cli:
