server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    location /archive-api/ {
        proxy_pass http://backend:9099/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
    # Preview URLs contain a short-lived media-only ticket, so do not log their query strings.
    location ~ ^/archive-api/telegram/archive/media/[0-9]+/content$ {
        access_log off;
        rewrite ^/archive-api/(.*)$ /$1 break;
        proxy_pass http://backend:9099;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
    }
}
